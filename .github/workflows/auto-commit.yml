name: Profile timestamp

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: profile-timestamp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}

      - name: Update timestamp
        run: |
          epoch=$(date -u '+%s')
          printf 'Last updated: %s UTC\nTimestamp: %s\n' "$(date -u -d "@$epoch" '+%Y-%m-%d %H:%M:%S')" "$epoch" > update.txt

      - name: Commit and push timestamp
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- update.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin "HEAD:${GITHUB_REF_NAME}"
